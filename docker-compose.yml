name: gyv-commercial-process-mining

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gyv_process_mining}
      POSTGRES_USER: ${POSTGRES_USER:-gyv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gyv_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - app_network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      DEVIATION_INACTIVITY_HOURS: ${DEVIATION_INACTIVITY_HOURS:-72}
      ML_SNAPSHOT_INTERVAL_HOURS: ${ML_SNAPSHOT_INTERVAL_HOURS:-12}
      ML_MODEL_DIR: ${ML_MODEL_DIR:-/app/ml/models}
      ALERT_RISK_THRESHOLD: ${ALERT_RISK_THRESHOLD:-0.70}
      ALERT_BATCH_LIMIT: ${ALERT_BATCH_LIMIT:-100}
      ANALYST_ENABLED: ${ANALYST_ENABLED:-true}
      ANALYST_LLM_PROVIDER: ${ANALYST_LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      ANALYST_MAX_TOOL_ROUNDS: ${ANALYST_MAX_TOOL_ROUNDS:-6}
      ANALYST_MAX_HISTORY_MESSAGES: ${ANALYST_MAX_HISTORY_MESSAGES:-10}
      ANALYST_TIMEOUT_SECONDS: ${ANALYST_TIMEOUT_SECONDS:-60}
      ANALYST_MAX_TOOL_RESULT_ITEMS: ${ANALYST_MAX_TOOL_RESULT_ITEMS:-50}
      ANALYST_TEMPERATURE: ${ANALYST_TEMPERATURE:-0.1}
      POSTGRES_DB: ${POSTGRES_DB:-gyv_process_mining}
      POSTGRES_USER: ${POSTGRES_USER:-gyv_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gyv_password}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-gyv_user}:${POSTGRES_PASSWORD:-gyv_password}@database:5432/${POSTGRES_DB:-gyv_process_mining}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ml_models:/app/ml/models
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app_network
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.4
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test:
        - CMD
        - ollama
        - list
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    networks:
      - app_network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
        VITE_DATASET_NOTICE: ${VITE_DATASET_NOTICE:-Datos simulados de demostración}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1/
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - app_network
    restart: unless-stopped

volumes:
  postgres_data:
  ml_models:
  ollama_data:

networks:
  app_network:
    driver: bridge
